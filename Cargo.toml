[package]
name = "etch-gen"
version = "0.1.0"
edition = "2021"
authors = ["Systems Programmer"]
description = "AI-powered blockchain generator using Etch architecture"
license = "MIT"
repository = "https://github.com/awdemos/etch"
rust-version = "1.75"

[[bin]]
name = "etch-gen"
path = "src/main.rs"

[lib]
name = "etch_gen"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
handlebars = "5.1"
chrono = "0.4"
tempfile = "3.16"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"
